{% extends 'base.html' %}
{% block content %}
<h1>Catégories</h1>
<form method="post" class="card p-3 mb-3">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Ajouter catégorie</button>
</form>
<ul class="list-group">
  {% for category in categories %}
    <li class="list-group-item">{{ category.name }}{% if category.description %} - {{ category.description }}{% endif %}</li>
  {% endfor %}
</ul>
{% endblock %}
