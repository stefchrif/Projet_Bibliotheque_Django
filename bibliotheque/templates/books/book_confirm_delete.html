{% extends 'base.html' %}
{% block content %}
<h1>Supprimer un livre</h1>
<p>Confirmer la suppression de <strong>{{ book.title }}</strong> ?</p>
<form method="post">{% csrf_token %}
  <button type="submit" class="btn btn-danger">Supprimer</button>
  <a href="{% url 'books:book-list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
